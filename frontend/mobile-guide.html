<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Screen Sharing Guide</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f7;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #007AFF;
            border-bottom: 3px solid #007AFF;
            padding-bottom: 10px;
        }
        .platform {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border-left: 5px solid;
        }
        .android { border-color: #3DDC84; }
        .ios { border-color: #007AFF; }
        .steps { 
            margin: 15px 0;
            padding-left: 20px;
        }
        .step {
            margin: 10px 0;
            display: flex;
            align-items: center;
        }
        .step-number {
            background: #007AFF;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .important {
            background: #FFF3CD;
            border: 2px solid #FFC107;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .back-button {
            display: inline-block;
            background: #007AFF;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Mobile Screen Sharing Guide</h1>
        
        <div class="important">
            <strong>⚠️ Important Notes:</strong>
            <ul>
                <li>Screen sharing requires HTTPS connection</li>
                <li>iOS support is limited and requires iOS 14+</li>
                <li>Android Chrome 89+ is recommended</li>
            </ul>
        </div>
        
        <div class="platform android">
            <h2>🤖 Android Devices</h2>
            <p>Follow these steps to share your screen:</p>
            <div class="steps">
                <div class="step">
                    <div class="step-number">1</div>
                    Open Chrome
